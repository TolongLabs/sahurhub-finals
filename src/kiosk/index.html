<!doctype html>
<!--
  Build the browser bundle before serving the Bun kiosk route:
  bun build src/kiosk/main.ts --outdir src/kiosk/dist --target browser --loader '.png:file' --public-path=/dist/

  The generated dist/ directory is intentionally not committed. The desktop
  preview checks 480×320 correctness only; Pi GPU/SPI/panel behaviour remains
  hardware validation work (Spike B/T13).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SahurHub — Kiosk</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; cursor: none; }
      body { color: #f3e6d0; font: 11px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #stage {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 100vh;
        background: #000;
        transform: translate(-50%, -50%);
        transform-origin: center;
      }
      #stage[data-rotation='90'], #stage[data-rotation='270'] { width: 100vh; height: 100vw; }
      #stage[data-rotation='90'] { transform: translate(-50%, -50%) rotate(90deg); }
      #stage[data-rotation='180'] { transform: translate(-50%, -50%) rotate(180deg); }
      #stage[data-rotation='270'] { transform: translate(-50%, -50%) rotate(270deg); }
      #stage canvas { display: block; width: 100%; height: 100%; }
      body { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      .renderer-badge, #connection, #phone-link { position: fixed; z-index: 2; border: 1px solid #3c7a72; background: #000c; }
      .renderer-badge { top: 7px; left: 7px; padding: 3px; color: #d9a066; }
      #connection { top: 7px; right: 7px; padding: 3px 5px; color: #72d6c8; }
      #connection[data-state='down'] { color: #d9a066; }
      #phone-link { right: 0; bottom: 0; max-width: 240px; padding: 14px 12px; color: #f3e6d0; font-size: 9px; word-break: break-all; }
      #qr-hotzone { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; height: 84px; background: transparent; }
      #device-input { position: fixed; z-index: 3; left: 50%; bottom: 12px; transform: translateX(-50%); text-align: center; }
      #device-talk { border: 1px solid #d9a066; border-radius: 999px; background: #241c16; color: #f3e6d0; padding: 10px 15px; font: inherit; }
      #device-status { display: block; margin-top: 4px; color: #72d6c8; }
      #qr-overlay { position: fixed; inset: 0; z-index: 10; background: #000d; display: grid; place-items: center; }
      .qr-card { background: #fff; padding: 10px; border-radius: 8px; text-align: center; }
      .qr-card svg { display: block; width: 190px; height: 190px; }
      .qr-card p { margin: 6px 0 0; color: #222; font-size: 9px; word-break: break-all; max-width: 190px; }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Sahur character display"></main>
    <output id="connection" data-state="down">CONNECTING</output>
    <output id="phone-link">PHONE</output>
    <div id="qr-hotzone" aria-hidden="true"></div>
    <section id="device-input" hidden>
      <button id="device-talk" type="button">HOLD TO TALK</button>
      <output id="device-status"></output>
    </section>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
